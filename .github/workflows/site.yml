# Сборка сайта бег#заЧанку. Готовый сайт кладётся в ветку site, хостинг REG.RU забирает его сам (CRON).
# Запускается: при каждом изменении в репозитории, каждые 15 минут по запросу с хостинга (zachanku-pull.sh),
# раз в час по расписанию (запасной вариант, GitHub может опаздывать) и вручную кнопкой Run workflow.
#
# Нужны секреты (Settings → Secrets and variables → Actions → New repository secret):
#   TELEGRAM_BOT_TOKEN — токен бота для публикации статей в канал
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"   # запасной запуск раз в час; основной — каждые 15 минут по запросу с хостинга
  workflow_dispatch:

permissions:
  contents: write   # чтобы сохранить свежий анонс в репозиторий

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Забрать анонс из Telegram
        run: python scripts/fetch_announce.py

      - name: Сохранить анонс, если он изменился
        run: |
          if ! git diff --quiet data/announce.json; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git commit -am "Анонс из Telegram"
            git push
          fi

      - name: Забрать прогноз погоды
        run: python scripts/fetch_weather.py

      - name: Собрать сайт
        run: python build.py

      # Выкладка без FTP: с 06.10.2026 REG.RU закрыл FTP/SFTP для зарубежных адресов (защита от DDoS),
      # а PHP на тарифе запрещён. Поэтому готовый сайт кладётся в ветку «site» этого репозитория,
      # а хостинг каждые 5 минут сам забирает её скриптом hosting/zachanku-pull.sh (Планировщик CRON).
      # Ветка обновляется, только если сборка изменилась (сравниваем отпечаток build-hash.txt).
      - name: Положить сайт в ветку site
        run: |
          HASH=$(cd dist && find . -type f ! -name build-hash.txt | sort | xargs sha256sum | sha256sum | cut -c1-16)
          echo "$HASH" > dist/build-hash.txt
          OLD=""
          if git fetch -q --depth=1 origin site 2>/dev/null; then
            OLD=$(git show FETCH_HEAD:build-hash.txt 2>/dev/null | tr -d ' \r\n' || true)
          fi
          echo "сборка: $HASH, в ветке site: ${OLD:-нет}"
          if [ "$HASH" = "$OLD" ]; then
            echo "сайт не изменился, выкладывать нечего"
            exit 0
          fi
          cd dist
          git init -q
          git checkout -q -b site
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка $HASH"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          echo "ветка site обновлена, хостинг заберёт её в течение 5 минут"

      - name: Опубликовать новые статьи в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_telegram.py

      - name: Запомнить опубликованные статьи
        run: |
          if [ -f data/posted.json ] && { ! git ls-files --error-unmatch data/posted.json >/dev/null 2>&1 || ! git diff --quiet data/posted.json; }; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add data/posted.json
            git commit -m "Статьи опубликованы в Telegram"
            git pull --rebase
            git push
          fi
