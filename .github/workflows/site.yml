# Сборка сайта бег#заЧанку и выкладка на хостинг REG.RU по FTP.
# Запускается: при каждом изменении в репозитории, каждые 30 минут (подхватить анонс из Telegram)
# и вручную кнопкой Run workflow во вкладке Actions.
#
# Нужны секреты (Settings → Secrets and variables → Actions → New repository secret):
#   FTP_SERVER    — адрес FTP-сервера из письма REG.RU / раздела «Доступы» хостинга
#   FTP_USERNAME  — логин FTP (обычно вида u1234567)
#   FTP_PASSWORD  — пароль FTP
#   FTP_DIR       — папка сайта на хостинге, например www/zachanku.ru/  (со слешем в конце)
name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # чтобы сохранить свежий анонс в репозиторий

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Забрать анонс из Telegram
        run: python scripts/fetch_announce.py

      - name: Сохранить анонс, если он изменился
        run: |
          if ! git diff --quiet data/announce.json; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git commit -am "Анонс из Telegram"
            git push
          fi

      - name: Забрать прогноз погоды
        run: python scripts/fetch_weather.py

      - name: Собрать сайт
        run: python build.py

      # Выкладываем, только если сайт действительно изменился: так к FTP REG.RU
      # подключаемся несколько раз в день, а не 48. Отпечаток сборки лежит на сайте в build-hash.txt.
      - name: Проверить, изменился ли сайт
        id: check
        run: |
          HASH=$(cd dist && find . -type f ! -name build-hash.txt | sort | xargs sha256sum | sha256sum | cut -c1-16)
          echo "$HASH" > dist/build-hash.txt
          LIVE=$(curl -fsS --max-time 20 "https://zachanku.ru/build-hash.txt" 2>/dev/null || echo "нет")
          echo "сборка: $HASH, на сайте: $LIVE"
          if [ "$HASH" = "$LIVE" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Выложить на REG.RU по FTP
        id: ftp1
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          timeout: 120000
          # загружаются только изменённые файлы; список хранится на хостинге в .ftp-deploy-sync-state.json

      # Если REG.RU оборвал соединение (ECONNRESET), ждём минуту и пробуем ещё раз.
      - name: Подождать перед повтором
        if: steps.ftp1.outcome == 'failure'
        run: sleep 60

      - name: Выложить на REG.RU по FTP (повтор)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
          timeout: 120000

      - name: Опубликовать новые статьи в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/post_telegram.py

      - name: Запомнить опубликованные статьи
        run: |
          if [ -f data/posted.json ] && { ! git ls-files --error-unmatch data/posted.json >/dev/null 2>&1 || ! git diff --quiet data/posted.json; }; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git add data/posted.json
            git commit -m "Статьи опубликованы в Telegram"
            git pull --rebase
            git push
          fi
