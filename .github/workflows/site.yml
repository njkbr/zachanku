name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Забрать анонс из Telegram
        run: python scripts/fetch_announce.py

      - name: Сохранить анонс, если он изменился
        run: |
          if ! git diff --quiet data/announce.json; then
            git config user.name "site-bot"
            git config user.email "site-bot@users.noreply.github.com"
            git commit -am "Анонс из Telegram"
            git push
          fi

      - name: Собрать сайт
        run: python build.py

      - name: Выложить на REG.RU по FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          protocol: ftps
